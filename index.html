<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Ratio in Schooling - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">📊 Gender Ratio Project</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="showDashboard()">Dashboard</button>
            <button id="dev-mode-btn" class="dev-btn" onclick="toggleDevMode()">Developer Mode</button>
        </div>
    </nav>

    <!-- Dashboard Section -->
    <main class="container">
        <header class="hero">
            <h1>School Directory & Analytics Dashboard</h1>
            <p>Select a school to view comprehensive enrollment, equity metrics, scholarships, and download reports.</p>
        </header>

        <!-- Developer Mode Form (Hidden by Default, Password Protected) -->
        <div id="developer-form-section" class="card form-card" style="display: none;">
            <h3>Add New School Record (Admin Only)</h3>
            <form id="school-form">
                <div class="form-group">
                    <label for="school-name">School / Village Name:</label>
                    <input type="text" id="school-name" placeholder="e.g., ZPHS Guntur" required>
                </div>
                <div class="form-group">
                    <label for="total-students">Total Students:</label>
                    <input type="number" id="total-students" min="1" required>
                </div>
                <div class="form-group">
                    <label for="boys-count">Boys Count:</label>
                    <input type="number" id="boys-count" min="0" required>
                </div>
                <div class="form-group">
                    <label for="girls-count">Girls Count:</label>
                    <input type="number" id="girls-count" min="0" required>
                </div>
                <button type="submit" class="primary-btn">Save School Record</button>
            </form>
        </div>

        <!-- Search Bar Section -->
        <div class="card search-card">
            <input type="text" id="school-search-input" placeholder="🔍 Search schools by name or village..." onkeyup="filterSchools()">
        </div>

        <!-- School List Grid / Cards -->
        <div class="card list-card">
            <h3>Registered Schools</h3>
            <div id="school-list-container" class="school-grid">
                <!-- Dynamically populated school list items -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
