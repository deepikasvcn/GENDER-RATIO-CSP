<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Analytics & Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand" id="page-school-title">📊 School Profile</div>
        <div class="nav-links">
            <button class="nav-btn" onclick="window.location.href='index.html'">← Back to Dashboard</button>
        </div>
    </nav>

    <main class="container">
        <!-- 1. School Summary Card (At least 7 lines of analytical overview) -->
        <div class="card summary-card">
            <h2>Institutional Summary & Overview</h2>
            <p id="school-summary-text">
                Loading comprehensive institutional analysis...
            </p>
        </div>

        <!-- 2. Detailed Metrics Grid -->
        <div class="metrics-grid">
            <div class="card metric-box">
                <h4>Attendance Rate</h4>
                <p id="metric-attendance" class="metric-value">--</p>
            </div>
            <div class="card metric-box">
                <h4>Transfer Rate</h4>
                <p id="metric-transfer" class="metric-value">--</p>
            </div>
            <div class="card metric-box">
                <h4>Dropout Rate</h4>
                <p id="metric-dropout" class="metric-value">--</p>
            </div>
            <div class="card metric-box">
                <h4>Gender Ratio (G/100B)</h4>
                <p id="metric-ratio" class="metric-value">--</p>
            </div>
        </div>

        <!-- 3. Real Bar Chart & Visualizations -->
        <div class="card chart-card">
            <h3>Enrollment & Demographic Bar Chart</h3>
            <canvas id="schoolDetailChart"></canvas>
        </div>

        <!-- 4. Scholarships & Opportunities -->
        <div class="card opportunities-card">
            <h2>Scholarships, Government Schemes & Opportunities</h2>
            <ul id="opportunities-list">
                <!-- Dynamically populated schemes -->
            </ul>
        </div>

        <!-- 5. Individual Download Button -->
        <div class="card download-card" style="text-align: center; padding: 20px;">
            <button class="primary-btn download-btn" onclick="downloadSchoolReport()">📥 Download School Report (PDF/Summary)</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
